<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- High-Definition Hollywood Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@300;400;700;900&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold: #FFD700;
      --gold-glow: rgba(255, 215, 0, 0.4);
      --hollywood-red: #E50914;
      --red-glow: rgba(229, 9, 20, 0.6);
      --bg-dark: #050508;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: #FFFFFF;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      /* HD Atmospheric Film Still Background */
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(229, 9, 20, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(255, 215, 0, 0.08) 0%, transparent 40%),
        linear-gradient(to bottom, rgba(5,5,8,0.7) 0%, rgba(5,5,8,0.95) 100%),
        url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=2070&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    /* Top Navigation Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 25px 8%;
      background: rgba(5, 5, 8, 0.6);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-logo {
      font-family: 'Cinzel', serif;
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 6px;
      color: #FFF;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
    }

    .brand-logo span {
      color: var(--hollywood-red);
      text-shadow: 0 0 20px var(--red-glow);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .credit-badge {
      background: rgba(255, 215, 0, 0.08);
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 2px;
      box-shadow: 0 0 15px var(--gold-glow);
      text-transform: uppercase;
    }

    .btn-buy {
      background: linear-gradient(135deg, #28a745 0%, #1e7e34 100%);
      color: #FFF;
      text-decoration: none;
      padding: 10px 22px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
      transition: all 0.3s ease;
    }

    .btn-buy:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(40, 167, 69, 0.7);
    }

    /* Main Container */
    .hero-container {
      max-width: 900px;
      margin: 60px auto 100px;
      padding: 0 20px;
      text-align: center;
    }

    .hero-title {
      font-family: 'Cinzel', serif;
      font-size: 3.5rem;
      font-weight: 900;
      letter-spacing: 8px;
      text-transform: uppercase;
      line-height: 1.1;
      margin-bottom: 15px;
      background: linear-gradient(180deg, #FFFFFF 30%, #888888 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      drop-shadow: 0 10px 20px rgba(0,0,0,0.8);
    }

    .hero-subtitle {
      font-size: 1.1rem;
      color: #A0A0B0;
      font-weight: 300;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    /* Glossy Glassmorphic Card */
    .studio-card {
      background: rgba(15, 15, 22, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 40px;
      backdrop-filter: blur(25px);
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.9),
        0 0 40px rgba(229, 9, 20, 0.1);
      position: relative;
    }

    .input-group {
      margin-bottom: 30px;
      text-align: left;
    }

    <a href="https://buy.stripe.com/test_8x2fZj0uE5SXd83gg7frW00" target="_blank" class="btn-buy">💳 Get 50 Credits</a>
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 10px;
      display: block;
    }

    textarea {
      width: 100%;
      height: 120px;
      background: rgba(5, 5, 8, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 18px;
      color: #FFF;
      font-family: 'Montserrat', sans-serif;
      font-size: 1rem;
      resize: none;
      transition: all 0.3s ease;
    }

    textarea:focus {
      outline: none;
      border-color: var(--hollywood-red);
      box-shadow: 0 0 20px var(--red-glow);
    }

    .btn-generate {
      width: 100%;
      padding: 20px;
      background: linear-gradient(135deg, #E50914 0%, #8B0000 100%);
      border: none;
      border-radius: 12px;
      color: #FFF;
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      font-weight: 900;
      letter-spacing: 4px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 10px 30px var(--red-glow);
      transition: all 0.3s ease;
    }

    .btn-generate:hover {
      transform: scale(1.02);
      box-shadow: 0 15px 40px rgba(229, 9, 20, 0.9);
    }

    /* Screenplay Output Card */
    .screenplay-output {
      margin-top: 40px;
      background: #FDFBF7; /* Authentic Screenplay Paper */
      color: #111;
      padding: 40px;
      border-radius: 8px;
      font-family: 'Courier Prime', monospace;
      text-align: left;
      line-height: 1.6;
      box-shadow: 0 15px 35px rgba(0,0,0,0.8);
      display: none; /* Shown dynamically via JS */
    }

    .screenplay-header {
      font-weight: bold;
      text-transform: uppercase;
      border-bottom: 2px solid #111;
      padding-bottom: 8px;
      margin-bottom: 20px;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

  <!-- Header Navigation -->
  <header>
    <div class="brand-logo">PLOT<span>TWIST</span></div>
    <div class="nav-actions">
      <div class="credit-badge">⚡ Credits: <span id="user-credits">5</span></div>
      <a href="YOUR_STRIPE_LINK_HERE" target="_blank" class="btn-buy">💳 Get 50 Credits</a>
    </div>
  </header>

  <!-- Hero Content Area -->
  <div class="hero-container">
    <h1 class="hero-title">Unscripted Brilliance</h1>
    <p class="hero-subtitle">The AI Twist Engine Built For Screenwriters & Producers</p>

    <div class="studio-card">
      <div class="input-group">
        <label class="input-label">Pitch / Scene Setup</label>
        <textarea id="prompt-input" placeholder="e.g., A detective uncovers a locked safe in a sunken submarine, but inside is a recent photograph of himself..."></textarea>
      </div>

      <button class="btn-generate" onclick="generateTwist()">⚡ GENERATE BLOCKBUSTER TWIST</button>

      <!-- Output Display Box -->
      <div id="output-box" class="screenplay-output">
        <div class="screenplay-header">EXT. HOLLYWOOD SOUNDSTAGE - NIGHT</div>
        <p id="output-text">Your script plot twist will appear here in authentic screenplay format...</p>
      </div>
    </div>
  </div>

  <script>
    // Paste your standard endpoint JavaScript logic here
    async function generateTwist() {
      const prompt = document.getElementById('prompt-input').value;
      const outputBox = document.getElementById('output-box');
      const outputText = document.getElementById('output-text');

      if (!prompt) {
        alert("Please enter a scene setup first!");
        return;
      }

      outputBox.style.display = "block";
      outputText.innerText = "CRAFTING CINEMATIC TWIST...";

      try {
        const response = await fetch('https://plot-twist-3csj.onrender.com/api/generate-script', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: prompt })
        });

        const data = await response.json();
        if (data.twist) {
          outputText.innerText = data.twist;
        } else {
          outputText.innerText = "Scene twist generated. Check your console/database output.";
        }
      } catch (err) {
        outputText.innerText = "Error generating twist. Ensure backend is active.";
      }
    }
  </script>
</body>
</html>
